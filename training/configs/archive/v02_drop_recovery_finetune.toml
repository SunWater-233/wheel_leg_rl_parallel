# Targeted fine-tuning on SCUT-v1 with explicit 8/14/20 cm forward drops and high stairs,
# preserving flat braking/height skills and sim2real wheel delay.
[task]
episode_seconds = 32.0
use_cad_base_hull = true
forward_command = [-2.5, 2.5]
yaw_command = [-4.0, 4.0]

[task.locomotion]
enabled = true
critic_terrain_observations = true
leg_torque_limit = 40.0
wheel_torque_limit = 5.0
wheel_target_delay_steps = 5
height_range = [0.17, 0.33]
height_max_probability = 0.10
height_rate = 0.30
height_acceleration = 0.90
speed_maneuvers = true
braking_maneuvers = true
launch_maneuvers = true
height_maneuvers = true
height_maneuver_sequence = [0.20, 0.24, 0.20, 0.33]
launch_press_seconds = [0.24, 0.70, 3.50, 5.50]
launch_stop_seconds = [0.50, 1.10, 1.80]
speed_maneuver_weights = [0.05, 0.15, 0.02, 0.03, 0.05, 0.20, 0.50]
command_speed_levels = [0.10, 0.20, 0.35, 0.55, 0.8, 1.2, 1.6, 2.0, 2.5]
command_acceleration_levels = [0.65, 0.85, 1.10]
command_acceleration_weights = [0.25, 0.60, 0.15]
manual_forward_acceleration = 0.60
terrain = "scut_v1"
terrain_traversal = true
cliff_drop_heights = [0.08, 0.14, 0.20]
cliff_approach_speed = 0.70
terrain_seed = 311

[task.locomotion.heading_hold]
enabled = true

[task.locomotion.low_recovery]
flat_episode_fraction = 0.05

[task.scut_rough_reward.tracking]
forward_deadband = 0.025
forward_reward_weight = 2.8
forward_error_width = 0.20
forward_error_clip = 1.60
forward_error_scale = 0.85
pitch_penalty_weight = 2.60
pitch_width = 0.016
ground_pitch_error_weight = 0.75
ground_pitch_rate_weight = 0.14
roll_penalty_weight = 3.00
roll_width = 0.008
flat_roll_error_weight = 0.65
flat_roll_rate_weight = 0.12

[task.scut_rough_reward.motion]
leg_action_curvature_weight = 0.008

[task.scut_rough_reward.regularization]
body_angular_velocity_weight = 0.20

[task.scut_rough_reward.braking]
preserve_across_airborne = true
enabled = true
recovery_seconds = 0.90
recovery_speed_weight = 0.65

[ppo]
save_interval = 25
max_action_std = 0.05

[ppo.algorithm]
learning_rate = 0.00003
schedule = "fixed"
num_learning_epochs = 4
clip_param = 0.15
entropy_coef = 0.0005
