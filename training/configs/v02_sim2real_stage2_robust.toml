# Sim2Real Stage 2 (Anti-oscillation & real-hardware dynamics alignment on V0.2):
# Diagnosed from real log 20261128_143353_rack_g100_v2 (6.15 Hz pitch-wheel limit cycle + 12.4 Hz roll-leg chatter):
#   1) All-joint command delay randomization: legs [8, 18] ms + wheels [10, 22] ms + actor IMU obs lag [2, 8] ms
#      (previously legs had 0 ms delay and IMU had 0 ms lag, causing negative roll damping and pitch phase loss)
#   2) Wheel reflected rotor inertia (wheel_armature = 0.005 kg·m², DR x[0.5, 1.6]) + viscous damping [0.0, 0.12]
#   3) Per-side asymmetric gas-spring DR [0.40, 1.15], wider mass [0.90, 1.25], independent 20 mm CoM jitter,
#      and wide PD gain DR (leg_kp x[0.60, 1.15], wheel_kv x[0.50, 1.15]) for high phase/gain margin
#   4) Stronger high-frequency smoothness & rate damping rewards (action_delta, leg/wheel curvature, wheel_acc,
#      body_angular_velocity, ground_pitch_rate, flat_roll_rate) + slightly higher gyro/dq noise
#   5) Larger reset tilt/joint perturbations (0.18 rad) and 20% standing episodes for calm GETUP->NORMAL handover
#
# Recommended usage on Colab:
#   --init-checkpoint .../v02_scut_stage2_scut_aligned/model_1600.pt --num-envs 2048 --iterations 1200
# Or from a Stage 1 Sim2Real flat checkpoint for 1800-2200 iterations.
[task]
episode_seconds = 32.0
use_cad_base_hull = true
forward_command = [-2.5, 2.5]
yaw_command = [-10.0, 10.0]

[task.observation_noise]
gyro = 0.08
gravity = 0.025
joint_position = 0.015
joint_velocity = 0.8

[task.locomotion]
enabled = true
critic_terrain_observations = true
actor_history_steps = 5
leg_torque_limit = 40.0
wheel_torque_limit = 5.0
wheel_armature = 0.005
leg_target_delay_steps = [4, 9]
wheel_target_delay_steps = 5
wheel_target_delay_steps_range = [5, 11]
imu_obs_delay_steps = [1, 4]
height_range = [0.17, 0.33]
obstacle_height_range = [0.18, 0.30]
hard_obstacle_height_range = [0.18, 0.27]
height_max_probability = 0.12
height_rate = 0.35
height_acceleration = 1.20
command_seconds = [2.5, 5.5]
command_acceleration_levels = [0.80, 1.80, 3.00, 4.00]
command_acceleration_weights = [0.20, 0.35, 0.30, 0.15]
direct_velocity_commands = true
direct_velocity_probability = 0.60
manual_forward_acceleration = 1.8
terrain = "scut_ground"
terrain_traversal = true
terrain_forward_limit = 0.0
terrain_seed = 733
scut_ground_scale = 1.00
scut_ground_bars_fraction = 0.20
scut_ground_bars_reverse_probability = 0.50
scut_ground_compound_fraction = 0.12
scut_ground_single_side_fraction = 0.08
scut_ground_speed_bump_fraction = 0.06
scut_ground_speed_bump_height = [0.025, 0.05]
scut_ground_speed_bump_length = 0.30
scut_ground_rough_slope_low_height_probability = 0.35

[task.locomotion.heading_hold]
enabled = true

[task.locomotion.low_recovery]
flat_episode_fraction = 0.08

[task.locomotion.special_mode_commands]
enabled = true
rel_standing_envs = 0.20
rel_zero_yaw_envs = 0.25
resampling_time_range = [2.5, 6.0]
min_episode_time = 2.0
require_stable = true
stable_gravity_xy_max = 0.35
stable_lin_vel_max = 3.0
stable_ang_vel_max = 10.0
normal_forward_range = [-2.5, 2.5]
normal_yaw_range = [-4.5, 4.5]

[[task.locomotion.special_mode_commands.modes]]
name = "dash"
rel_envs = 0.28
iteration_start = 0
iteration_end = -1
lin_vel_x = [[-2.5, -1.8], [1.8, 2.5]]
ang_vel_z = [[-4.5, 4.5]]

[[task.locomotion.special_mode_commands.modes]]
name = "spin_low"
rel_envs = 0.14
iteration_start = 0
iteration_end = -1
lin_vel_x = [[-0.1, 0.1]]
ang_vel_z = [[-7.0, -4.5], [4.5, 7.0]]

[[task.locomotion.special_mode_commands.modes]]
name = "spin_mid"
rel_envs = 0.12
iteration_start = 0
iteration_end = -1
lin_vel_x = [[-0.1, 0.1]]
ang_vel_z = [[-10.0, -7.0], [7.0, 10.0]]

[task.locomotion.terrain_commands]
enabled = true
fast_forward_range = [0.45, 2.35]
hard_forward_range = [0.45, 1.65]
fast_yaw_max = 2.2
hard_yaw_max = 1.0
zero_yaw_probability = 0.55
stop_probability = 0.16
spin_probability = 0.08
spin_yaw_range = [3.0, 6.5]
resampling_time_range = [1.3, 2.8]
engage_x = 3.3

[task.locomotion.terrain_curriculum]
enabled = true
promote_distance = 5.8
demote_distance = 4.2
max_level_weights = [0.20, 0.35, 0.45]

[task.locomotion.events]
enabled = true
push_interval_seconds = [5.0, 9.0]
push_vel_xy = 0.28
push_ang_vel_xy = 0.45
wrench_interval_seconds = [4.0, 8.0]
external_force_xyz = [10.0, 10.0, 6.0]
external_torque_xyz = [1.2, 1.2, 0.8]
wrench_zero_probability = 0.35
reset_roll_pitch_rad = 0.18
reset_yaw_rad = 0.20
reset_joint_pos_rad = 0.08
reset_lin_vel = 0.25
reset_ang_vel = 0.50
air_drop_flat_fraction = 0.10
air_drop_height_range = [0.07, 0.22]
air_drop_speed_max = 1.8
air_drop_brake_probability = 0.55

[task.domain_randomization]
enabled = true
nominal_probability = 0.15
contact_friction = [0.45, 0.60, 0.75, 0.90, 1.05, 1.20]
body_mass_scale = [0.90, 1.25]
com_jitter_xyz = [0.02, 0.02, 0.02]
spring_force_scale = [0.40, 1.15]
leg_kp_scale = [0.60, 1.15]
leg_kv_scale = [0.75, 1.35]
wheel_kv_scale = [0.50, 1.15]
wheel_armature_scale = [0.50, 1.60]

[task.domain_randomization.hips]
frictionloss_delta = [0.0, 0.25]
damping_delta = [0.0, 0.10]

[task.domain_randomization.wheels]
frictionloss_delta = [0.0, 0.10]
damping_delta = [0.0, 0.12]

[task.scut_rough_reward.tracking]
forward_deadband = 0.04
yaw_deadband = 0.05
forward_reward_weight = 2.5
forward_error_width = 0.25
forward_error_clip = 2.0
forward_error_scale = 0.55
vel_height_gate_enabled = true
vel_height_gate_flat_only = true
vel_height_gate_full_error = 0.04
vel_height_gate_zero_error = 0.09
yaw_reward_weight = 1.6
yaw_error_width = 0.35
yaw_error_clip = 2.5
yaw_error_scale = 0.50
spin_yaw_threshold = 4.5
spin_yaw_error_scale = 0.18
pitch_penalty_weight = 2.2
pitch_width = 0.02
ground_pitch_error_weight = 0.25
ground_pitch_rate_weight = 0.10
roll_penalty_weight = 2.4
roll_width = 0.01
flat_roll_error_weight = 0.55
flat_roll_rate_weight = 0.14
height_reward_weight = 1.0
height_error_width = 0.0012
height_error_scale = 10.0

[task.scut_rough_reward.motion]
action_delta_weight = 0.012
leg_action_curvature_weight = 0.016
wheel_action_curvature_weight = 0.008
leg_velocity_weight = 0.0025
wheel_acceleration_weight = 2e-6
wheel_gap_threshold_weight = 1.1
wheel_gap_scale = 5.0

[task.scut_rough_reward.regularization]
torque_weight = 4e-5
vertical_velocity_weight = 0.55
body_angular_velocity_weight = 0.12

[task.scut_rough_reward.braking]
enabled = true
preserve_across_airborne = true
recovery_seconds = 0.85
recovery_speed_weight = 0.55

[ppo]
save_interval = 100
max_action_std = 0.0
init_checkpoint_min_std = 0.25

[ppo.policy]
actor_hidden_dims = [256, 128, 64]
critic_hidden_dims = [256, 128, 64]
activation = "elu"
init_noise_std = 0.8

[ppo.algorithm]
learning_rate = 0.0001
schedule = "adaptive"
desired_kl = 0.01
num_learning_epochs = 5
num_mini_batches = 4
clip_param = 0.2
entropy_coef = 0.003
