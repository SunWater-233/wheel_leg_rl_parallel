[project]
name = "wheel_leg_parallel_training"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch==2.15.0+cu134",
    "torchvision==0.29.2+cu134",
    "genesis-world",
    "usd-core==26.11",
    "rsl-rl-lib==3.1.2",
    "scipy",
    "tensorboard>=2.21.0",
]

[tool.uv.sources]
torch = { index = "aliyun-pytorch" }
torchvision = { index = "aliyun-pytorch" }

[[tool.uv.index]]
name = "aliyun-pytorch"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu134/"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
