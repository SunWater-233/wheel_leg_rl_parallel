[task]
episode_seconds = 20.0
friction = 0.8
forward_command = [-0.5, 0.5] # m/s
yaw_command = [-0.5, 0.5] # rad/s

# Defaults for the SCUT V14 Rough-v1 reward used by Genesis.
[task.scut_rough_reward.tracking]
forward_deadband = 0.1 # m/s
yaw_deadband = 0.1 # rad/s
forward_reward_weight = 1.25
forward_error_clip = 1.0 # m/s, for the exponential term
forward_error_width = 0.5 # denominator of the exponential term
forward_error_scale = 0.25 # applied to the error before squaring
yaw_reward_weight = 1.0
yaw_error_clip = 0.8 # rad/s, for the exponential term
yaw_error_width = 0.25
yaw_error_scale = 0.5
standing_drift_weight = 1.0 # horizontal speed penalty at zero forward command
pitch_reward_weight = 1.0 # exponential reward on projected gravity X
pitch_width = 0.02
roll_reward_weight = 1.0 # exponential reward on projected gravity Y
roll_width = 0.01
tilt_base_scale = 2.0 # base error scale before squaring
tilt_low_speed_scale = 2.0 # additional error scale near zero forward command
tilt_speed_width = 3.0 # denominator of the speed-dependent exponential
pitch_penalty_weight = 2.0 # quadratic pitch penalty outside the airborne phase
roll_penalty_weight = 2.0 # quadratic roll penalty on the ground and in the air
height_reward_weight = 1.0
height_error_clip = 0.15 # m, for the exponential term
height_error_width = 0.001
height_error_scale = 10.0 # applied before squaring, outside the airborne phase

[task.scut_rough_reward.motion]
action_delta_weight = 0.002 # first difference of all policy actions
leg_action_curvature_weight = 0.005 # second difference of leg actions
wheel_action_curvature_weight = 0.001 # second difference of wheel actions
leg_acceleration_weight = 1e-7
wheel_acceleration_weight = 2e-9
leg_velocity_weight = 1e-3
wheel_velocity_weight = 2e-6
wheel_gap_threshold = 0.05 # m, fore-aft wheel-center separation in the body frame
wheel_gap_threshold_weight = 1.0 # fixed penalty when the wheel gap exceeds the threshold
wheel_gap_scale = 5.0 # 1/m, applied before squaring

[task.scut_rough_reward.regularization]
torque_weight = 1e-5 # squared actuator torque
wheel_power_weight = 1e-5 # positive mechanical wheel power
vertical_velocity_weight = 0.5
body_angular_velocity_weight = 0.05 # roll and pitch rates
nonwheel_contact_force_threshold = 3.0 # N
nonwheel_contact_weight = 2.0
airborne_nonwheel_contact_extra_weight = 48.0
fall_weight = 200.0
airborne_fall_extra_weight = 1000.0

[task.scut_rough_reward.airborne]
body_clearance_scan_radius = 0.01 # m, half-width of the 3-by-3 ground-height sample grid
knee_margin_fraction = 0.03 # soft-limit margin at each end of the knee travel
body_clearance_margin = 0.08 # m above the minimum stance clearance to detect liftoff
wheel_clearance_threshold = 0.08 # m from each tire to the ground to detect liftoff
liftoff_wheel_force_threshold = 1.0 # N, both wheels must be below this force
landing_wheel_force_threshold = 20.0 # N to count a wheel contact
landing_wheel_center_height = 0.15 # m, wheel-center height limit for counting contact
body_contact_force_threshold = 5.0 # N to count contact of a body link
wheel_contact_end_seconds = 0.30 # sustained wheel contact that ends the airborne phase
body_contact_end_seconds = 0.25 # sustained body contact that ends the airborne phase
max_airborne_seconds = 1.0
wheel_contact_transition_seconds = 0.02 # boundary between pre-contact and landing rewards
post_contact_end_seconds = 0.05 # end of the landing wheel-speed penalty window
body_contact_centering_seconds = 0.02 # body contact limit for the centering reward
wheel_torque_scale = 1.5 # N·m, divisor in the low-torque exponential reward
progress_speed_threshold = 1.0 # m/s, both commanded and measured speed
wheel_speed_scale = 10.0 # rad/s, wheel speed corresponding to full progress
centering_width = 0.02 # denominator of the wheel-centering exponential
low_torque_reward_weight = 20.0
wheel_progress_reward_weight = 10.0
landing_wheel_progress_penalty_weight = 10.0
centering_reward_weight = 10.0
knee_overrun_weight = 10.0

[task.domain_randomization]
enabled = false
nominal_probability = 0.25
contact_friction = [0.50, 0.65, 0.80, 0.95]
body_mass_scale = [0.95, 1.10]
# Load positions in meters relative to the nominal base COM, in the base frame.
load_offsets = [[-0.12, 0.0, 0.0], [0.05, -0.025, 0.10], [0.05, 0.025, 0.10]]

# Bounds are additive. Revolute groups use N·m and N·m·s/rad, sliders use N and N·s/m.
[task.domain_randomization.hips]
frictionloss_delta = [0.0, 0.15]
damping_delta = [0.0, 0.06]

[task.domain_randomization.passive]
frictionloss_delta = [0.0, 0.03]
damping_delta = [-0.008, 0.008]

[task.domain_randomization.springs]
frictionloss_delta = [0.0, 1.20]
damping_delta = [-1.0, 1.0]

[task.domain_randomization.wheels]
frictionloss_delta = [0.0, 0.05]
damping_delta = [0.0, 0.02]

[task.observation_noise]
gyro = 0.0 # rad/s standard deviation for actor inputs
gravity = 0.0 # standard deviation for components of the projected gravity vector
joint_position = 0.0 # rad
joint_velocity = 0.0 # rad/s, before observation scaling

[task.locomotion]
enabled = false
leg_torque_limit = 12.0 # N·m per active leg joint
height_range = [0.17, 0.20] # hip-to-wheel vertical projection, m
height_lowering_schedule = [] # [PPO iteration, minimum sampled leg height in m]
height_nominal = 0.20
height_max_probability = 0.0 # probability of sampling height_range's upper endpoint
height_rate = 0.30 # m/s
height_acceleration = 0.0 # m/s²; zero uses the legacy rate-only command
command_seconds = [2.0, 4.0]
speed_maneuvers = false
braking_maneuvers = false
launch_maneuvers = false # repeated start, cruise and stop at a fixed leg height
height_maneuvers = false # reserve flat-ground episodes for height changes at rest or at constant speed
stationary_episode_fraction = 0.0 # fraction of flat-ground episodes with fixed height and zero motion commands
launch_press_seconds = [] # optional total press durations, including the speed ramp
launch_stop_seconds = [] # optional time held at zero command after the braking ramp
speed_maneuver_weights = [] # random, straight, spin, slalom, optional corner brake, launch, and height changes
command_speed_levels = [] # per-episode speed caps in m/s
command_acceleration_levels = [] # per-episode acceleration caps in m/s²
command_acceleration_weights = [] # optional weights for command_acceleration_levels
cliff_approach_speed = 0.0 # optional training speed cap before a cliff landing
terrain = "plane"
terrain_traversal = false
terrain_seed = 42
cliff_drop_heights = [] # m; three forward-drop heights for scut_v1
slope_degrees = [3.0, 6.0]
roughness = 0.005 # m
obstacle_height = [0.005, 0.010] # m

[ppo]
num_steps_per_env = 24
save_interval = 500

[ppo.policy]
actor_hidden_dims = [256, 128, 64]
critic_hidden_dims = [256, 128, 64]
activation = "elu"
init_noise_std = 1.0

[ppo.algorithm]
value_loss_coef = 2.0
use_clipped_value_loss = true
clip_param = 0.2
entropy_coef = 0.005
num_learning_epochs = 5
num_mini_batches = 4
learning_rate = 0.0001
schedule = "adaptive"
gamma = 0.99
lam = 0.95
desired_kl = 0.01
max_grad_norm = 1.0
